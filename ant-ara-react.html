.nav-links a::after {

left: 0;
width: 0;

.nav-cta:hover {

.menu-toggle {

gap: 6px;
background: none;
border: none;

}

.menu-toggle span {
width: 24px;
height: 2px;
background: var(--dark);
border-radius: 2px;
transition: all 0.3s ease;
}

.hero {

display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 50%, #f1f3f5 100%);
position: relative;
padding: 8rem 2rem 4rem;
overflow: hidden;
}

.hero::before {
content: '';
position: absolute;
top: -50%;
right: -20%;
width: 600px;
height: 600px;
background: radial-gradient(circle, rgba(47, 79, 79, 0.08) 0%, transparent 70%);
border-radius: 50%;
animation: float 20s ease-in-out infinite;
}

.hero::after {
content: '';
position: absolute;
bottom: -30%;
left: -10%;
width: 500px;
height: 500px;
background: radial-gradient(circle, rgba(255, 107, 53, 0.06) 0%, transparent 70%);
border-radius: 50%;
animation: float 25s ease-in-out infinite reverse;
}

@keyframes float {
0%, 100% { transform: translate(0, 0) rotate(0deg); }
33% { transform: translate(30px, -30px) rotate(120deg); }
66% { transform: translate(-20px, 20px) rotate(240deg); }
}

.hero-content {
max-width: 1200px;
text-align: center;

}

.hero-logo {

}

-webkit-text-fill-color: transparent;
background-clip: text;
}

.hero-subtitle {
font-size: clamp(1.1rem, 2vw, 1.4rem);
color: var(--gray);
max-width: 700px;
margin: 0 auto 2.5rem;
line-height: 1.7;
font-weight: 400;
opacity: 0;
animation: fadeInUp 0.8s ease 0.4s forwards;
}

.hero-cta {
display: inline-flex;
align-items: center;
gap: 0.75rem;
padding: 1.2rem 2.5rem;
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
color: var(--white);
text-decoration: none;
font-weight: 600;
font-size: 1.1rem;
border-radius: 100px;
box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
transition: all 0.3s ease;
opacity: 0;
animation: fadeInUp 0.8s ease 0.6s forwards;
cursor: pointer;
border: none;
}

.hero-cta:hover {
transform: translateY(-3px);
box-shadow: 0 12px 32px rgba(255, 107, 53, 0.4);
}

@keyframes fadeInUp {
from {
opacity: 0;
transform: translateY(30px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

/* ========== STATS BAR ========== */
.stats-bar {
background: var(--dark);
color: var(--white);
padding: 2.5rem 2rem;
}

.stats-container {
max-width: 1200px;
margin: 0 auto;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 3rem;
text-align: center;
}

.stat-item {
position: relative;
}

.stat-item::after {
content: '';
position: absolute;
right: -1.5rem;
top: 50%;
transform: translateY(-50%);
width: 1px;
height: 60%;

}

.stat-item:last-child::after {
display: none;
}

.stat-number {

font-size: 2.5rem;
font-weight: 700;

margin-bottom: 0.5rem;

.stat-label {
font-size: 0.95rem;
color: rgba(255, 255, 255, 0.7);

}

section {
padding: 6rem 2rem;

.section-header {
text-align: center;
max-width: 800px;
margin: 0 auto 4rem;
}

.section-label {
display: inline-block;
padding: 0.5rem 1.2rem;
background: rgba(255, 107, 53, 0.1);
color: var(--orange);
border-radius: 100px;
font-size: 0.85rem;
font-weight: 600;

letter-spacing: 0.5px;

}

.section-title {

font-size: clamp(2rem, 4vw, 3rem);

letter-spacing: -0.5px;
}

.section-description {

color: var(--gray);
line-height: 1.7;
}

/* ========== CASES SECTION ========== */
.cases-section {
background: var(--gray-light);
}

.cases-grid {
max-width: 1300px;
margin: 0 auto;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
gap: 2rem;
}

.case-card {
background: var(--white);
border-radius: 20px;
overflow: hidden;
box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
position: relative;
}

.case-card:hover {
transform: translateY(-8px);
box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
}

.case-image {
width: 100%;
height: 240px;
object-fit: cover;
transition: transform 0.4s ease;
}

.case-card:hover .case-image {
transform: scale(1.05);
}

.case-content {
padding: 2rem;
}

.case-tag {
display: inline-block;
padding: 0.4rem 1rem;
background: linear-gradient(135deg, var(--teal) 0%, var(--green) 100%);
color: var(--white);
border-radius: 100px;
font-size: 0.8rem;
font-weight: 600;
margin-bottom: 1rem;
}

.case-card h3 {
font-family: var(--font-display);
font-size: 1.5rem;
color: var(--dark);
margin-bottom: 1rem;
font-weight: 700;
line-height: 1.3;
}

.case-card p {
color: var(--gray);
line-height: 1.7;
margin-bottom: 1.5rem;
font-size: 0.95rem;
}

.case-result {
padding: 1rem;
background: rgba(76, 175, 80, 0.08);
border-left: 3px solid var(--green);
border-radius: 8px;
margin-bottom: 1.5rem;
}

.case-result strong {
color: var(--green);
font-weight: 600;
}

.case-link {
display: inline-flex;
align-items: center;
gap: 0.5rem;
color: var(--orange);
font-weight: 600;
text-decoration: none;
transition: gap 0.3s ease;
cursor: pointer;
}

.case-link:hover {
gap: 0.75rem;
}

/* ========== SERVICES SECTION ========== */
.services-section {
background: var(--white);
}

.services-grid {
max-width: 1200px;
margin: 0 auto;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
gap: 2.5rem;
}

.service-card {
padding: 2.5rem;
border-radius: 20px;
border: 1px solid rgba(0, 0, 0, 0.06);
transition: all 0.4s ease;
background: var(--white);
position: relative;
overflow: hidden;
}

.service-card::before {
content: '';
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 4px;
background: linear-gradient(90deg, var(--teal) 0%, var(--green) 100%);
transform: scaleX(0);
transform-origin: left;
transition: transform 0.4s ease;
}

.service-card:hover::before {
transform: scaleX(1);
}

.service-card:hover {
transform: translateY(-8px);
box-shadow: 0 12px 40px rgba(47, 79, 79, 0.15);
border-color: rgba(47, 79, 79, 0.2);
}

.service-icon {
width: 64px;
height: 64px;
background: linear-gradient(135deg, var(--teal) 0%, var(--green) 100%);
border-radius: 16px;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.8rem;
color: var(--white);
margin-bottom: 1.5rem;
box-shadow: 0 8px 20px rgba(47, 79, 79, 0.2);
}

.service-card h3 {
font-family: var(--font-display);
font-size: 1.5rem;
color: var(--dark);
margin-bottom: 1rem;
font-weight: 700;
}

.service-card p {
color: var(--gray);
line-height: 1.7;
margin-bottom: 2rem;
}

.service-link {
display: inline-flex;
align-items: center;
gap: 0.5rem;
color: var(--teal);
font-weight: 600;
text-decoration: none;
transition: all 0.3s ease;
cursor: pointer;
}

.service-link:hover {
gap: 0.75rem;
color: var(--orange);
}

/* ========== CHAMPION CTA ========== */
.champion-cta {
background: linear-gradient(135deg, var(--dark) 0%, var(--dark-secondary) 100%);
color: var(--white);
position: relative;
overflow: hidden;
}

.champion-cta::before {
content: '';
position: absolute;
top: -50%;
right: -20%;
width: 500px;
height: 500px;
background: radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, transparent 70%);
border-radius: 50%;
}

.champion-content {
max-width: 1200px;
margin: 0 auto;
display: grid;
grid-template-columns: 1.2fr 1fr;
gap: 4rem;
align-items: center;
position: relative;
z-index: 2;
}

.champion-text h2 {
font-family: var(--font-display);
font-size: clamp(2rem, 4vw, 3.5rem);
font-weight: 800;
margin-bottom: 1.5rem;
line-height: 1.2;
}

.champion-text .highlight {
color: var(--orange);
}

.champion-text p {
font-size: 1.2rem;
line-height: 1.7;
margin-bottom: 2rem;
opacity: 0.9;
}

.champion-features {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 1.5rem;
margin-bottom: 2.5rem;
}

.champion-feature {
display: flex;
align-items: center;
gap: 0.75rem;
}

.champion-feature i {
color: var(--orange);
font-size: 1.2rem;
}

.champion-feature span {
font-weight: 500;
}

.champion-btn {
display: inline-flex;
align-items: center;
gap: 0.75rem;
padding: 1.2rem 2.5rem;
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
color: var(--white);
text-decoration: none;
font-weight: 700;
font-size: 1.1rem;
border-radius: 100px;
box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
transition: all 0.3s ease;
cursor: pointer;
border: none;
}

.champion-btn:hover {
transform: translateY(-3px);

}

.champion-visual {

.champion-visual img {
width: 100%;
border-radius: 20px;

.team-member:hover .team-avatar {

.team-member h3 {

.team-role {

.team-bio {

.social-links {

justify-content: center;
}

.social-links a {
width: 40px;
height: 40px;
background: var(--white);
border: 1px solid rgba(0, 0, 0, 0.1);

display: flex;
align-items: center;
justify-content: center;
color: var(--dark);
text-decoration: none;
transition: all 0.3s ease;
}

.social-links a:hover {
background: var(--orange);
color: var(--white);
border-color: var(--orange);
transform: translateY(-3px);
}

/* ========== FOOTER ========== */
footer {
background: var(--dark);
color: var(--white);
padding: 4rem 2rem 2rem;
}

.footer-content {
max-width: 1200px;
margin: 0 auto;
display: grid;
grid-template-columns: 1.5fr repeat(3, 1fr);
gap: 3rem;
margin-bottom: 3rem;
}

.footer-brand {
display: flex;
flex-direction: column;
gap: 1rem;
}

.footer-logo {
height: 50px;
width: auto;
margin-bottom: 0.5rem;
}

.footer-brand p {
color: rgba(255, 255, 255, 0.7);
line-height: 1.7;
font-size: 0.95rem;
}

.footer-section h4 {
font-family: var(--font-display);
font-size: 1.1rem;
font-weight: 700;
margin-bottom: 1.5rem;
color: var(--orange);
}

.footer-links {
display: flex;
flex-direction: column;
gap: 0.75rem;
}

.footer-links a {
color: rgba(255, 255, 255, 0.7);
text-decoration: none;
font-size: 0.95rem;
transition: all 0.3s ease;
cursor: pointer;
}

.footer-links a:hover {
color: var(--orange);
transform: translateX(4px);
}

.footer-contact {
display: flex;
flex-direction: column;
gap: 1rem;
}

.footer-contact a {
color: rgba(255, 255, 255, 0.7);
text-decoration: none;
font-size: 0.95rem;
display: flex;
align-items: center;
gap: 0.5rem;
transition: color 0.3s ease;
}

.footer-contact a:hover {
color: var(--orange);
}

.footer-bottom {
max-width: 1200px;
margin: 0 auto;
padding-top: 2rem;
border-top: 1px solid rgba(255, 255, 255, 0.1);
text-align: center;
color: rgba(255, 255, 255, 0.5);
font-size: 0.9rem;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 968px) {
.nav-links {
position: fixed;
top: 80px;
left: -100%;
width: 100%;
height: calc(100vh - 80px);
background: rgba(255, 255, 255, 0.98);
backdrop-filter: blur(12px);
flex-direction: column;
justify-content: center;
padding: 2rem;
gap: 2rem;
transition: left 0.3s ease;
}

.nav-links.active {
left: 0;
}

.menu-toggle {
display: flex;
}

.hero {
padding: 6rem 1.5rem 3rem;
}

.stats-container {
grid-template-columns: 1fr;
gap: 2rem;
}

.stat-item::after {
display: none;
}

.cases-grid,
.services-grid {
grid-template-columns: 1fr;
}

.champion-content {
grid-template-columns: 1fr;
text-align: center;
}

.champion-features {
grid-template-columns: 1fr;
}

.champion-feature {
justify-content: center;
}

.footer-content {
grid-template-columns: 1fr;
}
}

html {
scroll-behavior: smooth;
}
</style>
