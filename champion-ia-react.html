right: -20%;

height: 600px;
background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);

.champion-badge {

.after-card {

.footer-bottom {

@media (max-width: 968px) {
.transformation-grid {

}

.modules-grid,
.pricing-cards {
grid-template-columns: 1fr;
}

.pricing-card.popular {
transform: scale(1);

}

html {
scroll-behavior: smooth;
